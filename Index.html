<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TD Macro Builder PRO</title>

<style>
body{
  background:#0a0c10;
  color:#c8d8e8;
  font-family:sans-serif;
}
.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}
button{
  padding:8px 12px;
  margin:4px;
  cursor:pointer;
}
input{
  padding:6px;
  margin:4px;
}
.panel{
  background:#141820;
  padding:12px;
  margin-bottom:12px;
}
#codeOutput{
  background:#060810;
  padding:10px;
  white-space:pre;
  min-height:200px;
}
</style>
</head>

<body>
<div class="container">

<h2>🔥 TD Macro Builder PRO</h2>

<div class="panel">
  <h3>Preset</h3>
  <input id="presetName" placeholder="Stage Name">
  <button onclick="newPreset()">NEW</button>
  <button onclick="deletePreset()">DELETE</button>
  <button onclick="renamePreset()">RENAME</button>
</div>

<div class="panel">
  <h3>Add Step</h3>

  <select id="type">
    <option>VoteGameMode</option>
    <option>SpeedChange</option>
    <option>Summon</option>
    <option>Upgrade</option>
    <option>Wait</option>
  </select>

  <div id="fields"></div>

  <button onclick="addStep()">+ Add Step</button>
</div>

<div class="panel">
  <h3>Steps</h3>
  <div id="stepList"></div>
</div>

<div class="panel">
  <h3>Config</h3>
  <input id="macroName" value="MyMacro">
  <input id="loopCount" type="number" value="1">
</div>

<div class="panel">
  <button onclick="generateCode()">⚡ Generate</button>
  <button onclick="copyCode()">Copy</button>
  <button onclick="exportJSON()">Export</button>
  <button onclick="importJSON()">Import</button>
</div>

<div id="codeOutput"></div>

</div>

<script>
let presets = [];
let activePreset = -1;

function saveData(){
  localStorage.setItem("td_macro", JSON.stringify(presets));
}

function loadData(){
  const data = localStorage.getItem("td_macro");
  if(data) presets = JSON.parse(data);
}

function newPreset(){
  const name = document.getElementById("presetName").value || "Stage";
  presets.push({name,steps:[]});
  activePreset = presets.length-1;
  renderSteps();
  saveData();
}

function deletePreset(){
  if(activePreset<0) return;
  presets.splice(activePreset,1);
  activePreset = 0;
  renderSteps();
  saveData();
}

function renamePreset(){
  if(activePreset<0) return;
  presets[activePreset].name = document.getElementById("presetName").value;
  saveData();
}

function addStep(){
  if(activePreset<0) return;

  const type = document.getElementById("type").value;
  let s = {type};

  if(type==="VoteGameMode"){
    s.mode="Extreme";
  }

  if(type==="SpeedChange"){
    s.value=true;
  }

  if(type==="Summon"){
    s.unit="Gojo_Rage";
    s.x=0; s.y=0; s.z=0;
    s.rotation=0;
  }

  if(type==="Upgrade"){
    s.unit="Gojo_Rage";
    s.maxLv=5;
  }

  if(type==="Wait"){
    s.sec=1;
  }

  presets[activePreset].steps.push(s);
  renderSteps();
  saveData();
}

function renderSteps(){
  const el = document.getElementById("stepList");

  if(activePreset<0){
    el.innerHTML="No preset";
    return;
  }

  const steps = presets[activePreset].steps;

  el.innerHTML = steps.map((s,i)=>`
    <div>
      ${i+1}. ${s.type}
      <button onclick="delStep(${i})">X</button>
    </div>
  `).join("");
}

function delStep(i){
  presets[activePreset].steps.splice(i,1);
  renderSteps();
  saveData();
}

function buildCode(preset,macro,loop){
  let L=[];

  L.push(`local Input = game:GetService("ReplicatedStorage"):WaitForChild("Remotes"):WaitForChild("Input")`);
  L.push(`local Server = game:GetService("ReplicatedStorage"):WaitForChild("Remotes"):WaitForChild("Server")`);

  L.push(loop==0?`while true do`:`for _=1,${loop} do`);

  preset.steps.forEach(s=>{

    if(s.type==="VoteGameMode"){
      L.push(`Input:FireServer("VoteGameMode","${s.mode}")`);
    }

    if(s.type==="SpeedChange"){
      L.push(`Input:FireServer("SpeedChange",${s.value})`);
    }

    if(s.type==="Summon"){
      L.push(`
Input:FireServer("Summon",{
  Unit="${s.unit}",
  Rotation=${s.rotation},
  cframe=CFrame.new(${s.x},${s.y},${s.z})
})
`);
    }

    if(s.type==="Upgrade"){
      L.push(`
for _,u in pairs(workspace.Unit:GetChildren()) do
  if u.Name=="${s.unit}" then
    local tag = u:FindFirstChild("UpgradeTag")
    if tag then
      while tag.Value < ${s.maxLv} do
        Server:InvokeServer("Upgrade",u)

        local prev = tag.Value
        local t = tick()

        repeat task.wait(0.2)
        until tag.Value > prev or tick()-t > 10
      end
    end
  end
end
`);
    }

    if(s.type==="Wait"){
      L.push(`task.wait(${s.sec})`);
    }

  });

  L.push(`end`);
  return L.join("\n");
}

function generateCode(){
  if(activePreset<0) return;

  const code = buildCode(
    presets[activePreset],
    document.getElementById("macroName").value,
    document.getElementById("loopCount").value
  );

  window._code = code;
  document.getElementById("codeOutput").textContent = code;
}

function copyCode(){
  navigator.clipboard.writeText(window._code || "");
}

function exportJSON(){
  const data = JSON.stringify(presets,null,2);
  navigator.clipboard.writeText(data);
  alert("Copied JSON");
}

function importJSON(){
  const txt = prompt("Paste JSON");
  if(!txt) return;

  presets = JSON.parse(txt);
  activePreset = 0;
  renderSteps();
  saveData();
}

(function(){
  loadData();
  if(!presets.length){
    presets=[{name:"Stage 1",steps:[]}];
  }
  activePreset=0;
  renderSteps();
})();
</script>

</body>
</html>
